rules:
  - id: legacy-php-mysql-connect
    message: mysql_connect() is deprecated; use mysqli or PDO
    severity: WARNING
    languages: [php]
    patterns:
      - pattern: mysql_connect(...)
      - pattern: mysql_query(...)

  - id: legacy-php-eval
    message: usage of eval() / create_function() detected
    severity: ERROR
    languages: [php]
    patterns:
      - pattern: eval(...)
      - pattern: create_function(...)
